<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Reconciliation + OCR (Fixed)</title>

<!-- ใช้ CDN ที่เสถียร -->
<script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

<style>
body{font-family:Arial;background:#f4f6fb;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
button{padding:10px 20px;border:none;border-radius:10px;background:#007bff;color:#fff;cursor:pointer}
textarea{width:100%;height:120px;margin-top:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<h2>💊 Medication Reconciliation + OCR (Fixed)</h2>

<div class="card">
<h3>📷 อัปโหลดรูป</h3>
<input type="file" id="img_ipd"><br><br>
<input type="file" id="img_dc"><br><br>
<input type="file" id="img_home"><br><br>
<button onclick="processImages()">🔍 แปลงภาพเป็นข้อความ</button>
</div>

<div class="card">
<h3>📄 ข้อความยา</h3>
<label>IPD</label>
<textarea id="ipd"></textarea>
<label>D/C</label>
<textarea id="dc"></textarea>
<label>Home Med</label>
<textarea id="home"></textarea>
</div>

<div class="card">
<button onclick="compare()">⚖️ เปรียบเทียบ</button>
</div>

<div class="card">
<h3>ผลลัพธ์</h3>
<div id="result"></div>
</div>

<script>

// OCR FUNCTION (แก้ไขแล้ว)
async function ocr(file, target){
  try{
    document.getElementById(target).value = "⏳ กำลังอ่านภาพ...";

    const worker = await Tesseract.createWorker();

    await worker.load();
    await worker.loadLanguage('tha+eng');
    await worker.initialize('tha+eng');

    const { data: { text } } = await worker.recognize(file);

    document.getElementById(target).value = text;

    await worker.terminate();

  }catch(e){
    console.error(e);
    alert("❌ OCR error: " + e.message);
  }
}

async function processImages(){
  if(img_ipd.files[0]) await ocr(img_ipd.files[0],'ipd');
  if(img_dc.files[0]) await ocr(img_dc.files[0],'dc');
  if(img_home.files[0]) await ocr(img_home.files[0],'home');
}

// PARSE TEXT → ARRAY
function parse(text){
  return text.split('\n').filter(l=>l.trim()!='').map(l=>({name:l,dosage:l}));
}

function mapDrug(list){
  let map={};
  list.forEach(d=>{map[d.name]=d});
  return map;
}

// COMPARE
function compare(){
  let ipd = parse(document.getElementById('ipd').value);
  let dc = parse(document.getElementById('dc').value);
  let home = parse(document.getElementById('home').value);

  let ipdMap = mapDrug(ipd);
  let dcMap = mapDrug(dc);
  let homeMap = mapDrug(home);

  let keys = new Set([...Object.keys(ipdMap),...Object.keys(dcMap),...Object.keys(homeMap)]);

  let html = `<table>
  <tr><th>ยา</th><th>IPD</th><th>D/C</th><th>Home</th><th>วิเคราะห์</th></tr>`;

  keys.forEach(k=>{
    let ipdD = ipdMap[k];
    let dcD = dcMap[k];
    let homeD = homeMap[k];

    let note="✔ ปกติ";

    if(ipdD && !dcD) note="❌ ลืมสั่งกลับบ้าน";
    else if(!ipdD && dcD) note="➕ ยาใหม่ตอน D/C";
    else if(homeD && !ipdD) note="⚠ ไม่ได้ใช้ตอน admit";
    else if(ipdD && dcD && ipdD.dosage!==dcD.dosage) note="⚠ วิธีใช้ต่าง";

    html += `<tr>
    <td>${k}</td>
    <td>${ipdD?ipdD.dosage:'-'}</td>
    <td>${dcD?dcD.dosage:'-'}</td>
    <td>${homeD?homeD.dosage:'-'}</td>
    <td>${note}</td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById('result').innerHTML = html;
}

</script>

</body>
</html>
